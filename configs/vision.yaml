# Vision: can an AI market maker trade from a picture? Each review, the AI makers are shown a chart
# of their last epoch (best bid and ask, the mid, their own fills, inventory and P&L), the way a
# human trader sees a screen. Baseline: the usual data tools, no chart. Variants: the chart as well
# as the tools, or the chart instead of the tools.
name: vision
seeds: [321, 322, 323, 324, 325, 326]
description: >-
  Muse Spark and Muse Spark Open makers compete with GLFT and a momentum bot. Baseline: data
  tools only. Variants add a chart of each maker's last epoch to its review, or replace the data
  tools with the chart.
base:
  seed: 321
  steps_per_epoch: 2000
  n_epochs: 6
  agents:
    - {id: glft, kind: glft}
    - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
    - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
variants:
  - name: with_chart
    label: "Tools + chart"
    change: "Each AI maker also sees a chart of its last epoch."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {vision: with_tools}}
        - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026", params: {vision: with_tools}}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: chart_only
    label: "Chart only"
    change: "Each AI maker sees only the chart of its last epoch, with no data tools."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {vision: only}}
        - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026", params: {vision: only}}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
