# 23-hour trading. US exchanges start 23x5 trading on 6 Dec 2026; overnight volume is about 1% of
# the day's. Epochs alternate between the regular session and the overnight session, where scripted
# investors are 10% as active and news still arrives. In epoch 3 (overnight) the company cuts its
# guidance (fair value -2.5%). Two AI makers (Muse Spark, Spark Open) and GLFT quote. Today's market
# closes overnight; the variants keep it open, and add a forced sale overnight or in the day.
name: overnight
seeds: [281, 282, 283, 284, 285, 286]
description: >-
  Day and overnight sessions alternate. A guidance cut arrives overnight in epoch 3. Baseline: the
  exchange closes overnight. Variants trade 23 hours with overnight activity at 10% of daytime, and
  add the same forced sale of 600 lots overnight or during the day.
base:
  seed: 281
  steps_per_epoch: 1500
  n_epochs: 8
  session: {pattern: [day, night], night_trading: false, night_activity: 0.1}
  news: {misleading: 0.15, earnings_every: 100000, earnings_bps: 0}
  shocks:
    - {at_step: 4800, asset: A, bps: -250, headline: "After the close: A cuts its full-year guidance"}
  population:
    retail: {rate: 0.15, chartist: 0.25}
    institutional: {algo: twap, parent_rate: 0.0015, parent_size: 60, horizon: 300}
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
variants:
  - name: overnight
    label: "23-hour trading"
    change: "The exchange stays open overnight, with investor activity at 10% of daytime."
    overrides: {session: {night_trading: true}}
  - name: night_fire_sale
    label: "23-hour trading + forced sale overnight"
    change: "Open overnight; a fund is forced to sell 600 lots in 100 steps during the overnight session (epoch 5)."
    overrides:
      session: {night_trading: true}
      population: {fire_sale: {at_step: 7600, asset: A, qty: 600, over: 100}}
  - name: day_fire_sale
    label: "23-hour trading + forced sale in the day"
    change: "Open overnight; the same forced sale happens in the regular session instead (epoch 4)."
    overrides:
      session: {night_trading: true}
      population: {fire_sale: {at_step: 6100, asset: A, qty: 600, over: 100}}
