# Competing exchanges. Stock A trades on its home exchange (A) and an entrant (A.X): same fair
# value, separate order books. Investors' orders go to the best price (ties to the lower taker
# fee); an HFT arbitrages between the venues. The AI makers quote both and choose per venue.
# Does a maker rebate let the entrant win the flow, and who pays for it?
name: venues
seeds: [201, 202, 203, 204, 205, 206]
description: >-
  Stock A listed on two exchanges. Two AI makers (Muse Spark, Spark Open) and GLFT quote both;
  retail and institutional orders route to the best price. Variants change the entrant's fees.
base:
  seed: 201
  steps_per_epoch: 2000
  n_epochs: 6
  listings: {A: [A.X]}
  population:
    retail: {rate: 0.2, chartist: 0.2}
    institutional: {algo: twap, parent_rate: 0.0015, parent_size: 60, horizon: 300}
    latency_arb: {}
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
variants:
  - name: entrant_rebate
    label: "Entrant pays makers (maker-taker)"
    change: "A.X pays makers a 2 bps rebate and charges takers 3 bps; the home venue charges nothing."
    overrides: {rules: {venue_fees: {A.X: [-2.0, 3.0]}}}
  - name: entrant_inverted
    label: "Entrant pays takers (inverted)"
    change: "A.X charges makers 1.5 bps and pays takers a 0.5 bps rebate."
    overrides: {rules: {venue_fees: {A.X: [1.5, -0.5]}}}
  - name: fee_war
    label: "Both venues pay makers"
    change: "Both venues pay makers a 2 bps rebate and charge takers 3 bps."
    overrides: {rules: {venue_fees: {A: [-2.0, 3.0], A.X: [-2.0, 3.0]}}}
