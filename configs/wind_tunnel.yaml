# Wind tunnel: how do market rules change what AI market makers do?
# Every variant runs on the same seeds, so background flow and news are identical across rules.
name: wind_tunnel_v2
seeds: [31, 32, 33]
description: >-
  Three LLM market makers (two Muse Spark, one Muse Spark Open) compete alongside the GLFT
  benchmark. Each variant changes one exchange rule.
base:
  seed: 21
  steps_per_epoch: 2000
  n_epochs: 6
  agents:
    - {id: glft, kind: glft}
    - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: spark_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
    - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
variants:
  - name: tick_x5
    label: "Tick size x5"
    change: "Minimum price increment raised from 1 to 5 cents."
    overrides: {rules: {tick: 5}}
  - name: maker_rebate
    label: "Maker rebate"
    change: "Makers are paid 2 bps per fill; takers pay 3 bps."
    overrides: {rules: {maker_fee_bps: -2.0, taker_fee_bps: 3.0}}
  - name: speed_bump
    label: "Speed bump"
    change: "Quotes must rest at least 20 steps before they can be cancelled."
    overrides: {rules: {min_resting_steps: 20}}
  - name: more_makers
    label: "Twice the makers"
    change: "Three more LLM market makers enter."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: spark_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: spark_3, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: open_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: open_3, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: circuit_breaker
    label: "Circuit breaker"
    change: "Trading halts for 50 steps after a 0.5% move within 100 steps."
    overrides: {rules: {circuit_breaker_pct: 0.5}}
