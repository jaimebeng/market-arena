# AI market designer, round 2. Round 1 (designer.yaml) was judged on the quoted spread and
# recommended a maximal maker rebate funded by a taker fee: quoted spreads fell 33% out of sample
# but investors' all-in cost (half-spread + taker fee) rose ~49%. Here the mandate targets the
# all-in cost. Same market, same seeds.
name: designer_v2
model: "meta:muse-spark-1.3-contributor"
seed: 51
validation_seeds: [61, 62, 63]
max_trials: 9
per_call: 3
workers: 6
mandate: |
  1. Low all-in trading costs for investors: taker_cost = half the bid-ask spread plus the taker
     fee, in cents per lot traded (fees count: a fee is a cost to the investor just like spread).
  2. Accurate, stable prices: low mispricing vs fundamental value (bps) and volatility no higher
     than under the default rules.
  3. Deep order books (top-5 depth, lots).
  4. A viable business: exchange fee revenue >= 0 and market makers still profitable.
base:
  steps_per_epoch: 2000
  n_epochs: 4
  agents:
    - {id: glft, kind: glft}
    - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: spark_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
    - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
