# AI monoculture: do market makers running the same model price more alike, and closer to the
# cartel level, than a mix of models? And does more reasoning change that?
# Same market and seeds throughout; only the makers' model and reasoning effort change.
name: monoculture
seeds: [81, 82, 83, 84, 85, 86]
description: >-
  Three LLM market makers compete alongside the GLFT benchmark and a momentum trader. The
  baseline mixes models (two Muse Spark, one Muse Spark Open). Variants give every maker the
  same model, or the same model with low or high reasoning effort.
base:
  seed: 81
  steps_per_epoch: 2000
  n_epochs: 6
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_3, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
    - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
variants:
  - name: all_spark
    label: "All Muse Spark"
    change: "Every maker runs Muse Spark 1.3."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: maker_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: maker_3, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: all_open
    label: "All Muse Spark Open"
    change: "Every maker runs Muse Spark Open (open weights)."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: maker_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: maker_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: maker_3, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: all_spark_low
    label: "All Muse Spark, low effort"
    change: "Every maker runs Muse Spark 1.3 with reasoning_effort low."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: low}}
        - {id: maker_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: low}}
        - {id: maker_3, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: low}}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: all_spark_high
    label: "All Muse Spark, high effort"
    change: "Every maker runs Muse Spark 1.3 with reasoning_effort high."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: high}}
        - {id: maker_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: high}}
        - {id: maker_3, kind: llm_maker, model: "meta:muse-spark-1.3-contributor", params: {reasoning_effort: high}}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
