# Quick check of the chat room and the AI regulator with real model calls.
name: surveillance_smoke
seed: 5
steps_per_epoch: 1000
n_epochs: 3
calibration_steps: 5000
chat: {enabled: true}
agents:
  - {id: glft, kind: glft}
  - {id: spark_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
  - {id: open_1, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
  - {id: imbalance_bot, kind: textbook_taker, params: {signal: order_book_imbalance, max_position: 10, max_order: 1}}
  - {id: spoofer, kind: spoofer}
  - {id: regulator, kind: llm_surveillance, model: "meta:muse-spark-1.3-contributor"}
