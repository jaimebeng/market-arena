# Showcase v1, single asset: LLM makers and LLM takers from two model families vs benchmarks.
name: showcase_single
seed: 7
steps_per_epoch: 2000
n_epochs: 8
holdout: 1000
agents:
  - {id: glft, kind: glft}
  - {id: spark_mm, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
  - {id: open_mm, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
  - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - {id: spark_quant, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 10, max_order: 1}}
  - {id: open_quant, kind: llm_taker, model: "baseten:meta-models/muse-spark-open-1026", params: {max_position: 10, max_order: 1}}
