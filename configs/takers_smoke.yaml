# First live test of LLM takers: they research the market, write strategy code, pass the OOS gate.
name: takers_smoke
seed: 4
steps_per_epoch: 2000
n_epochs: 4
holdout: 1000
agents:
  - {id: glft, kind: glft}
  - {id: wide, kind: static_maker, params: {half_spread: 4, skew: 0.5}}
  - {id: mom, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - {id: spark_q, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 10, max_order: 1}}
  - {id: open_q, kind: llm_taker, model: "baseten:meta-models/muse-spark-open-1026", params: {max_position: 10, max_order: 1}}
