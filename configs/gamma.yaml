# Options and gamma. Retail investors trade short-dated call options with a dealer, who
# delta-hedges in the stock. If retail buys calls the dealer is short gamma and must buy into
# rallies and sell into falls; if retail writes calls the dealer is long gamma and damps moves.
# Do options make the stock more volatile, and how do the AI market makers respond?
name: gamma
seeds: [221, 222, 223, 224, 225, 226]
description: >-
  A dealer delta-hedges retail call options in the stock. Variants: retail buys calls (dealer
  short gamma) or writes them (dealer long gamma), against a market without options. Two AI
  makers and GLFT make the stock market.
base:
  seed: 221
  steps_per_epoch: 2000
  n_epochs: 6
  population:
    retail: {rate: 0.15, chartist: 0.25}
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
variants:
  - name: dealer_short_gamma
    label: "Retail buys calls (dealer short gamma)"
    change: "Retail buys about 0.2 one-lot calls per step, 1% out of the money, 2,000-step expiry; the dealer hedges."
    overrides: {population: {options: {flow: retail_buys_calls, rate: 0.2}}}
  - name: dealer_long_gamma
    label: "Retail writes calls (dealer long gamma)"
    change: "Retail writes the same calls to the dealer instead (e.g. covered calls); the dealer hedges."
    overrides: {population: {options: {flow: retail_writes_calls, rate: 0.2}}}
