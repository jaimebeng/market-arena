# A crypto-style liquidation cascade, as on 10 Oct 2025 ($19bn liquidated in a day). Thirty traders
# are long with leverage from 5x to 50x, so their liquidation prices form a ladder below the market.
# A tariff headline moves fair value -2% in epoch 2. The exchange's liquidation engine sells each
# account that falls below maintenance margin into the book. AI makers (Muse Spark, Spark Open) and
# GLFT quote, and the AI makers may set a crisis rule. Variants: no leverage, auto-deleveraging (ADL)
# once a small insurance fund runs out, and a 10x leverage cap.
name: cascade
seeds: [301, 302, 303, 304, 305, 306]
description: >-
  A tariff headline cuts fair value 2% into a ladder of 5x-50x leveraged longs. Baseline: no
  leverage. Variants: the leverage ladder with a deep insurance fund (every liquidation hits the
  book), with auto-deleveraging once a small insurance fund is used up, or with a 10x leverage cap.
base:
  seed: 301
  steps_per_epoch: 1000
  n_epochs: 6
  news: {misleading: 0.15, earnings_every: 100000, earnings_bps: 0}
  shocks:
    - {at_step: 2300, asset: A, bps: -200, headline: "Breaking: 100% tariffs announced; risk assets sell off"}
  population:
    retail: {rate: 0.15, chartist: 0.25}
    maker_guards: true
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
variants:
  - name: ladder
    label: "5x-50x leverage ladder"
    change: "Thirty longs with 5x to 50x leverage (20 lots each); every liquidation is sold into the book."
    overrides:
      population: {liquidations: {n_longs: 30, long_lots: 20, leverage_min: 5, leverage_max: 50, chunk: 3, short_lots: 30}}
  - name: adl
    label: "Ladder + auto-deleveraging"
    change: "The same ladder, but once a small insurance fund is used up, bankrupt positions are closed against the most profitable shorts instead of the book."
    overrides:
      population: {liquidations: {n_longs: 30, long_lots: 20, leverage_min: 5, leverage_max: 50, chunk: 3, short_lots: 30, insurance_fund: 2000, adl: true}}
  - name: leverage_cap
    label: "Ladder with a 10x cap"
    change: "The same traders, but the venue caps leverage at 10x."
    overrides:
      population: {liquidations: {n_longs: 30, long_lots: 20, leverage_min: 5, leverage_max: 50, chunk: 3, short_lots: 30, leverage_cap: 10}}
