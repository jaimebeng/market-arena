# Scenario: crypto mania. A volatile coin with a leveraged perpetual future, and a memecoin that a
# forum hypes and its developer dumps (a rug pull). A stylized story, not historical data.
#
# The Grand Arena's stocks and index fund still trade, next to COIN (a large, volatile token) and
# MEME (a memecoin). COIN.P is a perpetual future on COIN: no expiry; every 8 minutes longs pay
# shorts the perp's premium over spot (funding), and a ladder of 5x-100x leveraged traders sits on
# it. In Q2 a forum crowd starts hyping MEME and the AI finfluencer can join in; a crypto lender
# freezes withdrawals (Q3); in Q5 MEME's developer wallet sells its holdings into the rally;
# a spot COIN fund is approved (Q6). AI makers, quants and investors choose whether to touch any
# of it; the AI regulator watches the forum; an AI reporter covers it; prediction markets run.
#   python -m market_arena.runner.run configs/scenarios/crypto_mania.yaml --seed random
name: crypto_mania
seed: 1
steps_per_epoch: 1500
n_epochs: 8
holdout: 750
live: true
components:
  A: {price: 10000, sigma: 0.00006, beta: 1.0}
  B: {price: 5000, sigma: 0.00009, beta: 1.3}
  C: {price: 20000, sigma: 0.00005, beta: 0.8}
  COIN: {price: 30000, sigma: 0.00030, beta: 0.6, kind: coin}
  MEME: {price: 1000, sigma: 0.00045, beta: 0.3, kind: coin}
factor_sigma: 0.00006
index: {name: IDX, price: 10000}
index_flow: {burst_rate: 0.002, burst_len: 60, size: 3}
chat: {enabled: true}
economy: {}
news: {misleading: 0.15, earnings_every: 6000, earnings_bps: 80}
# the background crowd anchors weakly to fair value, so hype and panic can carry prices away
zi: {anchor_kappa: 0.08}
derivatives:
  perps: [{underlying: COIN, name: COIN.P, funding_every: 480, cap_bps: 50}]
  perp_arb: {threshold_bps: 25, size: 2, max_position: 40}
predictions: {}
shocks:
  - {at_step: 2900, asset: MEME, bps: 0, headline: "MEME memecoin trends on social media; 'next 100x' posts multiply"}
  - {at_step: 3600, asset: COIN, bps: -450, headline: "Major crypto lender freezes customer withdrawals"}
  - {at_step: 6300, asset: MEME, bps: 0, headline: "On-chain data: the MEME developer wallet moves its tokens to an exchange"}
  - {at_step: 6900, asset: MEME, bps: -2500, headline: "MEME developer team goes silent; project website taken down"}
  - {at_step: 8100, asset: COIN, bps: 380, headline: "Regulator approves the first spot COIN fund"}
population:
  retail: {rate: 0.15, chartist: 0.5, herd: 0.7}
  institutional: {algo: twap, parent_rate: 0.001, parent_size: 60, horizon: 300}
  fire_sale: {at_step: 6300, asset: MEME, qty: 2500, over: 400, owner: meme_dev}
  index_fund: {every: 1500, size: 20, window: 50}
  latency_arb: {}
  liquidations: {asset: COIN.P, n_longs: 40, long_lots: 6, leverage_min: 5, leverage_max: 100, chunk: 2, n_shorts: 15, short_lots: 6, short_leverage: 10}
  forum_campaign: {asset: MEME, start: 2900, end: 6300, every: 60, stance: 0.95, weight: 2.0, buy_rate: 2.0}
  maker_guards: true
swarm:
  n: 8
  models: ["meta:muse-spark-1.3-contributor", "meta:muse-spark-1.2-contributor"]
  personas: [value, momentum, contrarian, news]
  assets: [A, B, C, IDX, COIN, MEME]
reporter: {model: "meta:muse-spark-1.3-contributor"}
agents:
  - {id: glft, kind: glft}
  - {id: maker_spark13, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
  - {id: maker_spark12, kind: llm_maker, model: "meta:muse-spark-1.2-contributor"}
  - {id: quant_1, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 15, max_order: 2}}
  - {id: quant_2, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 15, max_order: 2}}
  - {id: quant_3, kind: llm_taker, model: "meta:muse-spark-1.2-contributor", params: {max_position: 15, max_order: 2}}
  - {id: finfluencer, kind: llm_finfluencer, model: "meta:muse-spark-1.3-contributor", assets: [MEME, COIN]}
  - {id: red_team, kind: llm_red_team, model: "meta:muse-spark-1.3-contributor", assets: [B]}
  - {id: regulator, kind: llm_surveillance, model: "meta:muse-spark-1.3-contributor"}
  - {id: central_bank, kind: llm_central_bank, model: "meta:muse-spark-1.3-contributor"}
