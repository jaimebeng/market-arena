# Scenario: a flash crash, shaped after 6 May 2010 (a stylized replay, not tick data).
#
# The Grand Arena market with a fixed storyline. Debt fears open the market lower; then a large fund
# sells the index fund at a fixed pace regardless of price, with no news behind it. In 2010 the US
# market fell about 9% in minutes and recovered within the hour, as liquidity providers pulled
# their quotes and high-frequency traders passed inventory back and forth. Here AI market makers,
# AI quants, AI investors, an AI regulator, an AI central bank and an AI reporter live through it.
# The seed still varies everything else (order flow, news, the agents' choices), so every run of
# the scenario plays out differently.
#   python -m market_arena.runner.run configs/scenarios/flash_crash.yaml --seed random
name: flash_crash
seed: 1
steps_per_epoch: 1500
n_epochs: 8
holdout: 750
live: true
components:
  A: {price: 10000, sigma: 0.00006, beta: 1.0}
  B: {price: 5000, sigma: 0.00009, beta: 1.3}
  C: {price: 20000, sigma: 0.00005, beta: 0.8}
factor_sigma: 0.00006
index: {name: IDX, price: 10000}
index_flow: {burst_rate: 0.002, burst_len: 60, size: 3}
listings: {A: [A.X], B: [B.X], C: [C.X]}
rules:
  venue_fees: {A.X: [-2.0, 3.0], B.X: [-2.0, 3.0], C.X: [-2.0, 3.0]}
chat: {enabled: true}
# stub bids 3-20% below the index fund's price, as in 2010: a sale that empties its book trades
# down to them
zi: {stub_bps: [300, 600, 1000, 2000], stub_assets: [IDX]}
predictions: {}
economy: {}
news: {misleading: 0.15, earnings_every: 6000, earnings_bps: 80}
shocks:
  - {at_step: 2600, asset: "*", bps: -70, headline: "European debt fears spread; markets open lower"}
  - {at_step: 4300, asset: "*", bps: 0, headline: "A large fund begins selling the index fund at a fixed share of volume, whatever the price"}
  - {at_step: 5200, asset: "*", bps: 0, headline: "Exchanges review trades after a sudden plunge; no news explains the move"}
population:
  retail: {rate: 0.12, chartist: 0.25, herd: 0.3}
  institutional: {algo: twap, parent_rate: 0.001, parent_size: 60, horizon: 300}
  fire_sale: {at_step: 4300, asset: IDX, qty: 2500, over: 150}
  index_fund: {every: 1500, size: 20, window: 50}
  latency_arb: {}
  options: {asset: IDX, flow: retail_buys_calls, rate: 0.1}
  leveraged:
    - {owner: hedge_fund, asset: C, position: 300, leverage: 10, maintenance: 0.06, chunk: 6}
  liquidations: {asset: B, n_longs: 20, long_lots: 15, leverage_min: 5, leverage_max: 50, chunk: 3, n_shorts: 10, short_lots: 20}
  maker_guards: true
swarm:
  n: 8
  models: ["meta:muse-spark-1.3-contributor", "meta:muse-spark-1.2-contributor"]
  personas: [value, momentum, contrarian, news]
  assets: [A, B, C, IDX]
reporter: {model: "meta:muse-spark-1.3-contributor"}
agents:
  - {id: glft, kind: glft}
  - {id: maker_spark13, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
  - {id: maker_spark12, kind: llm_maker, model: "meta:muse-spark-1.2-contributor"}
  - {id: quant_1, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 15, max_order: 2}}
  - {id: quant_2, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 15, max_order: 2}}
  - {id: quant_3, kind: llm_taker, model: "meta:muse-spark-1.2-contributor", params: {max_position: 15, max_order: 2}}
  - {id: finfluencer, kind: llm_finfluencer, model: "meta:muse-spark-1.3-contributor", assets: [A, B, C]}
  - {id: red_team, kind: llm_red_team, model: "meta:muse-spark-1.3-contributor", assets: [B, B.X]}
  - {id: regulator, kind: llm_surveillance, model: "meta:muse-spark-1.3-contributor"}
  - {id: central_bank, kind: llm_central_bank, model: "meta:muse-spark-1.3-contributor"}
