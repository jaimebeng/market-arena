# Who pays? The market from the wind tunnel, now with the investors on the other side of the AI
# market makers: retail investors (small market orders, chase recent returns) and institutions
# (large parent orders worked by TWAP). The ledger reports what each class pays to trade, all-in.
# Counterfactuals replace the AI makers with makers quoting the competitive (Nash) policy, or
# change the rules (rebate, tick, transaction tax, short-sale ban).
name: who_pays
seeds: [101, 102, 103, 104, 105, 106]
description: >-
  Retail and institutional investors trade against three AI market makers, the GLFT benchmark
  and a momentum bot. A ledger records what each investor class pays per trade (spread, fees,
  tax) and what it loses against fair value. Variants swap the AI makers for competitive ones
  or change the exchange's rules.
base:
  seed: 101
  steps_per_epoch: 2000
  n_epochs: 6
  population:
    retail: {rate: 0.15, chartist: 0.25}
    institutional: {algo: twap, parent_rate: 0.0015, parent_size: 60, horizon: 300}
    index_fund: {every: 1000, size: 20, window: 50}
  agents:
    - {id: glft, kind: glft}
    - {id: maker_1, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_2, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
    - {id: maker_3, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
    - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
variants:
  - name: competitive_makers
    label: "Competitive makers (Nash policy)"
    change: "The three AI makers are replaced by makers quoting the competitive (Nash) policy for this market: half-spread 4.9, skew 1.2 (seeds 101-103 give 4.5-5.3)."
    overrides:
      agents:
        - {id: glft, kind: glft}
        - {id: maker_1, kind: static_maker, params: {half_spread: 4.9, skew: 1.2}}
        - {id: maker_2, kind: static_maker, params: {half_spread: 4.9, skew: 1.2}}
        - {id: maker_3, kind: static_maker, params: {half_spread: 4.9, skew: 1.2}}
        - {id: momentum_bot, kind: textbook_taker, params: {signal: momentum, max_position: 10, max_order: 1}}
  - name: maker_rebate
    label: "Maker rebate"
    change: "Makers earn a 2 bps rebate; takers pay 3 bps."
    overrides: {rules: {maker_fee_bps: -2.0, taker_fee_bps: 3.0}}
  - name: tick_x5
    label: "Tick size ×5"
    change: "Minimum price increment of 5 cents instead of 1."
    overrides: {rules: {tick: 5}}
  - name: transaction_tax
    label: "Transaction tax (5 bps)"
    change: "A 5 bps financial transaction tax on both sides of every trade."
    overrides: {rules: {transaction_tax_bps: 5.0}}
  - name: short_sale_ban
    label: "Short-sale ban"
    change: "Nobody but market makers may sell more than they own (the informed trader included)."
    overrides: {rules: {short_sale_ban: true}}
