# Final demo run, multi-asset: three stocks and an index that tracks them.
# Can AI quants discover index arbitrage and cross-asset structure on their own?
name: final_multi
seed: 23
steps_per_epoch: 2000
n_epochs: 10
holdout: 1000
components:
  A: {price: 10000, sigma: 0.00006, beta: 1.0}
  B: {price: 5000, sigma: 0.00008, beta: 1.2}
  C: {price: 20000, sigma: 0.00005, beta: 0.8}
factor_sigma: 0.00006
index: {name: IDX, price: 10000}
index_flow: {burst_rate: 0.002, burst_len: 60, size: 3}
agents:
  - {id: glft, kind: glft}
  - {id: spark_mm, kind: llm_maker, model: "meta:muse-spark-1.3-contributor"}
  - {id: open_mm, kind: llm_maker, model: "baseten:meta-models/muse-spark-open-1026"}
  - {id: arb_bot, kind: textbook_taker, params: {signal: index_arbitrage, max_position: 10, max_order: 1}}
  - {id: spark_quant, kind: llm_taker, model: "meta:muse-spark-1.3-contributor", params: {max_position: 10, max_order: 1}}
  - {id: open_quant, kind: llm_taker, model: "baseten:meta-models/muse-spark-open-1026", params: {max_position: 10, max_order: 1}}
