[project]
name = "market-arena"
version = "0.1.0"
description = "A wind tunnel for markets: an artificial exchange where Meta Muse agents make markets, invent strategies, and are benchmarked against optimal market-making theory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "sortedcontainers>=2.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_arena"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
